<title>Sorry, Ritik</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700&family=Pacifico&display=swap">
<style>
/* Layout: one centred column on a pastel pink-lilac-blue gradient with twinkling glitter. Script name headline, speech bubble, round pleading panda with butterflies, sign-off. */
:root{
  --pink:#ffd9ee;
  --lilac:#e6d9ff;
  --sky:#d3ebff;
  --ink:#5b3f8c;
  --pink-strong:#d92f86;
  --purple-strong:#6d3fe0;
  --blue-strong:#1f7fd8;
  --bubble:#ffffff;
  --bubble-line:#ffc2e0;
  --line:#2a1f3d;
  --charcoal:#4f4a63;
  --charcoal-deep:#3a3450;
  --shade:#e6def8;
  --eye:#1f1530;
  --blush:#ff9fc4;
  --pad:#ffc2dc;
  --water:#bfe6ff;
  --gold:#ffc94d;
  --display:'Fredoka','Trebuchet MS',Arial,sans-serif;
  --script:'Pacifico','Brush Script MT',cursive;
  --body:'Nunito','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--lilac);
  background-image:linear-gradient(160deg,var(--pink) 0%,var(--lilac) 52%,var(--sky) 100%);
  background-attachment:fixed;
  color:var(--ink);
  font:600 17px/1.6 var(--body);
  padding-block:40px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100%;
}
.glitter{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.glitter i{
  position:absolute;display:block;background:var(--c,#fff);opacity:.9;
  clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
  animation:twinkle var(--d,2.6s) ease-in-out var(--l,0s) infinite;
}
.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:24px;min-width:0;text-align:center}
h1{margin:0;display:flex;flex-direction:column;align-items:center;gap:0}
h1 .sorry{
  font:600 clamp(34px,10vw,50px)/1.1 var(--display);color:var(--purple-strong);
  text-shadow:0 3px 0 rgba(255,255,255,.75);
}
h1 .name{
  position:relative;display:inline-block;
  font-family:var(--script);font-weight:400;
  font-size:min(calc((100vw - 48px) / 7),58px);line-height:1.25;
  white-space:nowrap;
  padding:0 .16em .1em;margin-top:-4px;max-width:100%;
  color:var(--purple-strong);
  background:linear-gradient(100deg,var(--pink-strong),var(--purple-strong),var(--blue-strong),var(--pink-strong));
  background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:shimmer 6s linear infinite;
  filter:drop-shadow(0 4px 0 rgba(255,255,255,.8));
}
h1 .name::before,h1 .name::after{
  content:"";position:absolute;background:#fff;
  clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
  animation:twinkle 2.2s ease-in-out infinite;
}
h1 .name::before{width:20px;height:20px;top:8%;right:2%;background:#ffe27a}
h1 .name::after{width:13px;height:13px;top:42%;left:-1%;animation-delay:.9s;background:#ff9fc4}
.bubble{
  position:relative;background:var(--bubble);color:var(--ink);
  border:3px solid var(--bubble-line);padding:18px 24px;border-radius:28px;max-width:100%;
  font:600 24px/1.25 var(--display);
  box-shadow:0 8px 0 -2px #f3c9e3,0 16px 28px -14px rgba(109,63,224,.45);
}
.bubble small{display:block;margin-top:4px;font:700 16px/1.4 var(--body);color:#8a6bc2}
.bubble::after{
  content:"";position:absolute;left:50%;bottom:-13px;width:22px;height:22px;background:var(--bubble);
  border-right:3px solid var(--bubble-line);border-bottom:3px solid var(--bubble-line);
  transform:translateX(-50%) rotate(45deg);border-radius:0 0 6px 0;
}
.panda{width:min(350px,92vw);height:auto;display:block;margin-top:4px;overflow:visible}
.ol{stroke:var(--line);stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
.white{fill:#fff}
.shade{fill:var(--shade)}
.char{fill:var(--charcoal)}
.deep{fill:var(--charcoal-deep)}
.eye{fill:var(--eye)}
.hl{fill:#fff}
.blush{fill:var(--blush);opacity:.85}
.pad{fill:var(--pad)}
.line{stroke:var(--line);fill:none;stroke-width:4;stroke-linecap:round}
.water{stroke:var(--water);fill:none;stroke-width:3.5;stroke-linecap:round;opacity:.9}
.ground{fill:rgba(109,63,224,.18)}
.head{transform-box:fill-box;transform-origin:center bottom;animation:sway 3.4s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s ease-in-out infinite}
.paws{animation:plead 1.3s ease-in-out infinite alternate}
.glint{transform-box:fill-box;transform-origin:center;animation:glint 2.2s ease-in-out infinite}
.fl{animation:float 4.6s ease-in-out infinite}
.fl.f2{animation-duration:5.4s;animation-delay:-1.2s}
.fl.f3{animation-duration:4.1s;animation-delay:-2.2s}
.fl.f4{animation-duration:5s;animation-delay:-3s}
.fl.f5{animation-duration:3.8s;animation-delay:-.6s}
.flap{transform-origin:0 0;animation:flap .55s ease-in-out infinite alternate}
.flap.g2{animation-duration:.7s}
.flap.g3{animation-duration:.48s}
.panda{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.panda:focus,.panda:active{outline:none}
.panda:focus-visible{outline:3px solid var(--pink-strong);outline-offset:6px;border-radius:28px}
.pet{transform-origin:150px 300px}
.pet.bow{animation:bow .9s ease-in-out}
.fxp{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop 1.6s ease-out forwards}
.hint{margin:-12px 0 0;font:700 14px/1.4 var(--body);letter-spacing:.06em;color:#8a6bc2}
.sign{font:600 26px/1.25 var(--display);color:var(--purple-strong);margin:0}
.sign .by{display:block;font:400 42px/1.3 var(--script);color:var(--pink-strong)}
.maaf{
  margin:6px 0 0;display:inline-block;padding:0 .12em .1em;
  font:400 clamp(40px,12.5vw,58px)/1.3 var(--script);
  color:var(--purple-strong);
  background:linear-gradient(100deg,var(--pink-strong),var(--purple-strong),var(--blue-strong),var(--pink-strong));
  background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:shimmer 6s linear infinite;
  filter:drop-shadow(0 3px 0 rgba(255,255,255,.8));
}
@keyframes bow{
  0%{transform:none}
  28%{transform:translateY(12px) scaleY(.92)}
  58%{transform:translateY(-7px) scaleY(1.04)}
  100%{transform:none}
}
@keyframes pop{
  0%{transform:translate(0,0) scale(.3);opacity:0}
  15%{opacity:1}
  100%{transform:translate(var(--dx,0px),-120px) scale(1.1);opacity:0}
}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes plead{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes glint{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes float{0%,100%{transform:translate(0,0)}25%{transform:translate(5px,-7px)}50%{transform:translate(-3px,-12px)}75%{transform:translate(-6px,-4px)}}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.35)}}
@keyframes twinkle{0%,100%{transform:scale(.55);opacity:.45}50%{transform:scale(1.1);opacity:1}}
@keyframes shimmer{to{background-position:250% 0}}
@media (prefers-reduced-motion:reduce){
  .head,.blink,.paws,.glint,.fl,.flap,.glitter i,h1 .name,h1 .name::before,h1 .name::after,.maaf{animation:none}
}
</style>

<div class="glitter" id="glitter" aria-hidden="true"></div>

        <circle cx="13" cy="-7" r="2.4" fill="#fff" opacity=".85"/>
        <circle cx="-10" cy="9" r="1.5" fill="#fff" opacity=".85"/>
        <circle cx="10" cy="9" r="1.5" fill="#fff" opacity=".85"/>

    <g class="head">

      <ellipse class="char" cx="104" cy="140" rx="33" ry="36" transform="rotate(14 104 140)"/>

<script>
(function(){
  var box=document.getElementById('glitter');
  var colors=['#ffffff','#ffffff','#ff9fc4','#c9b3ff','#9fd4ff','#ffe27a'];
  var frag=document.createDocumentFragment();
  for(var i=0;i<46;i++){
    var s=document.createElement('i');
    var size=6+Math.random()*14;
    s.style.left=(Math.random()*100)+'%';
    s.style.top=(Math.random()*100)+'%';
    s.style.width=size+'px';
    s.style.height=size+'px';
    s.style.setProperty('--c',colors[(Math.random()*colors.length)|0]);
    s.style.setProperty('--d',(1.6+Math.random()*2.4).toFixed(2)+'s');
    s.style.setProperty('--l',(-Math.random()*3).toFixed(2)+'s');
    frag.appendChild(s);
  }
  box.appendChild(frag);
})();

(function(){
  var svg=document.getElementById('pandaSvg'),pet=document.getElementById('pet'),fx=document.getElementById('fx');
  if(!svg||!pet||!fx)return;
  var NS='http://www.w3.org/2000/svg';
  var calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var heart='M0 6 C-10 -2 -8 -10 -3 -9 C-1 -8.5 0 -6 0 -6 C0 -6 1 -8.5 3 -9 C8 -10 10 -2 0 6Z';
  var star='M0 -8 L2.2 -2.2 L8 0 L2.2 2.2 L0 8 L-2.2 2.2 L-8 0 L-2.2 -2.2Z';
  var reds=['#ff2d55','#f0284e','#ff4d6d'];
  var cols=['#ff9fc4','#c9b3ff','#9fd4ff','#ffc94d'];
  function spawn(i){
    var g=document.createElementNS(NS,'g'),p=document.createElementNS(NS,'path');
    var isHeart=i%3!==2;
    var s=isHeart?(1+Math.random()*.8):(.8+Math.random()*.7);
    g.setAttribute('transform','translate('+(90+Math.random()*120).toFixed(1)+' '+(70+Math.random()*60).toFixed(1)+') scale('+s.toFixed(2)+')');
    p.setAttribute('d',isHeart?heart:star);
    var pool=isHeart?reds:cols;
    p.setAttribute('fill',pool[(Math.random()*pool.length)|0]);
    p.setAttribute('stroke','#fff');
    p.setAttribute('stroke-width','1.2');
    p.setAttribute('stroke-linejoin','round');
    if(calm){
      p.style.opacity='1';
    }else{
      p.setAttribute('class','fxp');
      p.style.setProperty('--dx',((Math.random()-.5)*60).toFixed(0)+'px');
      p.style.animationDelay=(i*45)+'ms';
    }
    g.appendChild(p);
    fx.appendChild(g);
    setTimeout(function(){if(g.parentNode)g.parentNode.removeChild(g)},calm?1100:2100);
  }
  function react(){
    if(!calm){pet.classList.remove('bow');pet.getBoundingClientRect();pet.classList.add('bow')}
    for(var i=0;i<10;i++)spawn(i);
  }
  svg.addEventListener('click',react);
  svg.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();react()}});
})();
</script>
